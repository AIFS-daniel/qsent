name: Autonomous Review

on:
  issues:
    types: [labeled]

concurrency:
  group: opencode-review-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'autonomous-review'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read prompt
        id: read-prompt
        run: |
          content=$(cat .github/prompts/review.md)
          content="${content//\$ISSUE_NUMBER/${{ github.event.issue.number }}}"
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Fetch secrets from Doppler
        run: |
          LINE=$(doppler secrets download --no-file --format docker --project qsent --config dev | grep '^GOOGLE_GENERATIVE_AI_API_KEY=')
          VALUE="${LINE#*=}"
          echo "::add-mask::$VALUE"
          echo "$LINE" >> "$GITHUB_ENV"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: google/gemini-2.5-flash
          prompt: ${{ steps.read-prompt.outputs.content }}
          use_github_token: true
