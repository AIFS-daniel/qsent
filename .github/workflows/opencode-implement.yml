name: Autonomous Implementation

on:
  issues:
    types: [labeled]

jobs:
  implement:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'autonomous'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for existing PR
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const issueNumber = context.payload.issue.number;
            const closingPattern = new RegExp(`(closes|fixes|resolves)\\s+#${issueNumber}\\b`, 'i');
            const linked = prs.data.find(pr =>
              pr.body && closingPattern.test(pr.body)
            );
            if (linked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ Implementation aborted — [PR #${linked.number}](${linked.html_url}) already exists for this issue. Apply the \`autonomous-review\` label to validate it instead.`
              });
              await core.summary
                .addHeading('⚠️ Implementation skipped')
                .addRaw(`Open PR <a href="${linked.html_url}">#${linked.number}</a> already exists for issue #${issueNumber}. Apply <code>autonomous-review</code> to validate it instead.`)
                .write();
              core.setOutput('pr_exists', 'true');
            } else {
              core.setOutput('pr_exists', 'false');
            }

      - name: Configure git identity
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          git config --global user.email "autonomous-agent@github-actions"
          git config --global user.name "Autonomous Agent"

      - name: Read prompt
        id: read-prompt
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          content=$(cat .github/prompts/implement.md)
          content="${content//\$ISSUE_NUMBER/${{ github.event.issue.number }}}"
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Implement
        if: steps.check-pr.outputs.pr_exists == 'false'
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: google/gemini-2.5-flash
          prompt: ${{ steps.read-prompt.outputs.content }}
          use_github_token: true
          share: true

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ Implementation failed — [view the Actions run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });
